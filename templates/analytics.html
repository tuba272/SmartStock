<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f4f7fb}.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:#173b67;color:white;padding:25px 15px}.menu{list-style:none}.menu li{margin:8px 0}.menu a{display:block;padding:13px 15px;color:white;text-decoration:none;border-radius:8px}.menu .active{background:#2f6db0}.main{margin-left:230px;padding:30px}.section{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08);margin-bottom:20px;display:inline-block;width:48%;vertical-align:top;margin-right:2%}</style>
</head><body>
<div class="sidebar"><h2 style="text-align:center">📦 SmartStock</h2><br><ul class="menu"><li><a href="/">📊 Dashboard</a></li><li><a href="/inventory">📦 Inventory</a></li><li><a href="/procurement">🛒 Procurement</a></li><li><a href="/issue">📤 Issue Stationery</a></li><li><a href="/analytics" class="active">📈 Analytics</a></li><li><a href="/alerts">⚠️ Alerts</a></li><li><a href="/history">📋 History</a></li></ul></div>
<div class="main"><h1 style="color:#173b67">Analytics & Reports</h1><br>
<div class="section"><h2>Stock Quantity by Item</h2><canvas id="barChart"></canvas></div>
<div class="section"><h2>Stock Distribution</h2><canvas id="pieChart"></canvas></div>
</div>
<script>
const names = [{% for i in inventory %}"{{ i.name }}",{% endfor %}];
const qtys = [{% for i in inventory %}{{ i.quantity }},{% endfor %}];
new Chart(document.getElementById('barChart'),{type:'bar',data:{labels:names,datasets:[{label:'Quantity',data:qtys,backgroundColor:'#173b67'}]}});
new Chart(document.getElementById('pieChart'),{type:'pie',data:{labels:names,datasets:[{data:qtys,backgroundColor:['#173b67','#2f6db0','#2e9d50','#f0ad00','#d43c3c']}]}});
</script>
</body></html>
